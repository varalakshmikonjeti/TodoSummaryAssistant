name: Todo Summary Assistant CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: Backend/todo-summary-assistant
        run: ./mvnw clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/todo
        run: npm ci

      - name: Test frontend
        working-directory: Frontend/todo
        run: CI=true npm test -- --watchAll=false

      - name: Build frontend
        working-directory: Frontend/todo
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t todo-summary-backend:${{ github.sha }} ./Backend/todo-summary-assistant

      - name: Build frontend Docker image
        run: docker build -t todo-summary-frontend:${{ github.sha }} ./Frontend/todo